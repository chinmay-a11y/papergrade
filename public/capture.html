<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperGrade — Capture</title>
<link rel="stylesheet" href="/stripe.css">
<div id="topbar"></div>
<div class="page">
  <h1 class="display-lg">Capture answer scripts</h1>
  <p class="sub">One page per student. Upload a batch or snap photos — grading starts automatically.</p>

  <div class="card">
    <label class="drop" id="drop" for="files">
      <div style="font-size:26px">🖼️</div>
      <div style="margin-top:6px">Tap to add student sheets</div>
      <div class="mute" style="font-size:13px">Select multiple · JPG · PNG · PDF (one student per page)</div>
    </label>
    <input type="file" id="files" accept="image/*,application/pdf" capture="environment" multiple style="display:none">
    <div class="thumbs" id="thumbs"></div>
    <div class="row" style="display:flex; gap:12px; margin-top:16px">
      <button class="btn btn-primary" id="uploadBtn" disabled>Upload &amp; grade</button>
      <a class="btn btn-secondary" href="#" id="toReview">Go to review console →</a>
    </div>
  </div>

  <div class="card" style="margin-top:20px">
    <h2 class="heading-lg" style="margin-bottom:12px">Batch status</h2>
    <div id="list" class="stack-sm"></div>
  </div>
</div>
<script src="/app.js"></script>
<script>
mountAppbar('capture');
document.getElementById('toReview').href = `/review.html?w=${WID}`;

let picked = [];
const filesInput = document.getElementById('files');
const uploadBtn = document.getElementById('uploadBtn');
const drop = document.getElementById('drop');

function addFiles(list) {
  picked = picked.concat([...list]);
  const thumbs = document.getElementById('thumbs');
  thumbs.innerHTML = '';
  picked.forEach(f => thumbs.append(el('img', { src: URL.createObjectURL(f) })));
  uploadBtn.disabled = picked.length === 0;
}
filesInput.onchange = () => addFiles(filesInput.files);
['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', e => { if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files); });

uploadBtn.onclick = async () => {
  uploadBtn.disabled = true; uploadBtn.textContent = 'Uploading…';
  const fd = new FormData();
  picked.forEach(f => fd.append('images', f));
  try {
    await api(`/api/w/${WID}/scripts`, { method: 'POST', body: fd });
    toast('Uploaded — grading in progress');
    filesInput.value = ''; picked = []; document.getElementById('thumbs').innerHTML = '';
  } catch (e) { toast('Upload failed: ' + e.message); }
  uploadBtn.textContent = 'Upload & grade';
};

function renderList(scripts) {
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!scripts.length) { list.append(el('p', { class: 'mute' }, 'No scripts yet — add sheets above.')); return; }
  scripts.forEach(s => {
    const score = (s.total_awarded != null && s.total_max)
      ? el('span', { class: 'tnum' }, `${fmt(s.total_awarded)} / ${fmt(s.total_max)}`) : el('span', { class: 'mute' }, '—');
    list.append(el('div', { class: 'card pad-sm', style: 'display:flex;align-items:center;gap:14px' },
      el('span', { class: 'tnum', style: 'flex:1;color:var(--ink-2)' }, s.student_alias),
      score,
      el('span', { class: 'st ' + s.status }, s.status.replace('_', ' ')),
    ));
  });
}
async function poll() { try { renderList((await api(`/api/w/${WID}/scripts`)).scripts); } catch {} }
poll(); setInterval(poll, 1500);
</script>
