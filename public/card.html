<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperGrade — Your feedback</title>
<link rel="stylesheet" href="/app.css">
<div class="wrap" style="max-width:520px">
  <div class="panel" style="margin-top:24px">
    <div class="center">
      <div class="muted mono" id="alias"></div>
      <div class="big" id="score">—</div>
      <div class="muted">your score</div>
    </div>

    <div id="audioWrap" class="center" style="margin:20px 0">
      <audio id="audio" controls style="width:100%"></audio>
      <p class="muted" id="transcript" style="font-size:14px;margin-top:8px"></p>
    </div>

    <h2>Per-question</h2>
    <div id="answers"></div>

    <h2 style="margin-top:20px">Practice these</h2>
    <div id="practice" class="muted"></div>
  </div>

  <div class="panel center" style="margin-top:16px">
    <div class="muted" style="font-size:13px;margin-bottom:8px">Share this card</div>
    <img id="qr" width="160" height="160" alt="QR">
  </div>
</div>
<script src="/app.js"></script>
<script>
if (!SID) { document.body.innerHTML = '<p style="padding:40px">No script id.</p>'; }
else {
  document.getElementById('qr').src = `/api/scripts/${SID}/qr.png`;
  api(`/api/scripts/${SID}/card`).then(d => {
    document.getElementById('alias').textContent = d.student_alias;
    document.getElementById('score').textContent = `${fmt(d.total_awarded)} / ${fmt(d.total_max)}`;
    if (d.audio_url) {
      document.getElementById('audio').src = d.audio_url;
      document.getElementById('transcript').textContent = d.transcript || '';
    } else {
      document.getElementById('audioWrap').classList.add('hidden');
    }
    const box = document.getElementById('answers');
    d.answers.forEach(a => {
      box.append(el('div', { class: 'lineitem' },
        el('div', { class: 'row', style: 'justify-content:space-between' },
          el('b', {}, `Q${a.question_no} · ${a.concept}`),
          el('span', { class: 'mono' }, `${fmt(a.awarded_marks)}/${fmt(a.max_marks)}`)),
        el('div', { class: 'muted', style: 'font-size:13px;margin-top:4px' }, a.rationale || '')));
    });
    const p = document.getElementById('practice');
    (d.practice_questions || []).forEach((q, i) =>
      p.append(el('div', { class: 'lineitem' }, `${i + 1}. ${q}`)));
  }).catch(e => toast('Load failed: ' + e.message));
}
</script>
