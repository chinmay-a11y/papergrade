<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperGrade — Review console</title>
<link rel="stylesheet" href="/stripe.css">
<div id="topbar"></div>
<div class="page">
  <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap">
    <div>
      <h1 class="display-lg">Review console</h1>
      <p class="sub" style="margin:4px 0 0">Lowest-confidence first. Confidence is the measured disagreement between two OCR passes — not a model self-report.</p>
    </div>
    <label style="display:flex; align-items:center; gap:8px; font-size:14px; color:var(--ink-2)">
      <input type="checkbox" id="onlyReview"> only needs-review
    </label>
  </div>
  <div id="answers" style="margin-top:20px"></div>
</div>
<script src="/app.js"></script>
<script>
mountAppbar('review');
let ALL = [];

function diffHtml(diff) {
  return el('div', { class: 'diff' }, ...(diff || []).map(tok => el('span', { class: tok.k }, tok.t + ' ')));
}

function renderItem(a) {
  const pct = Math.round((a.confidence || 0) * 100);
  const bar = el('div', { class: 'confbar' }, el('span', { class: confClass(a.confidence), style: `width:${pct}%` }));

  const marksInput = el('input', { type: 'text', class: 'input marks-input', value: fmt(a.awarded_marks) });
  const saveBtn = el('button', { class: 'btn btn-primary sm' }, 'Save');
  saveBtn.onclick = async () => {
    saveBtn.disabled = true;
    try {
      await api(`/api/answers/${a.id}/override`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ new_marks: Number(marksInput.value), reason_text: 'manual override' }),
      });
      toast(`Saved · audit logged (${fmt(a.awarded_marks)} → ${marksInput.value})`);
      a.awarded_marks = Number(marksInput.value); a.needs_human = false;
    } catch (e) { toast('Save failed: ' + e.message); }
    saveBtn.disabled = false;
  };

  const micBtn = el('button', { class: 'btn btn-secondary sm' }, '🎙 Speak reason');
  wireMic(micBtn, a, marksInput);

  const rubricLines = (a.rubric_item?.criteria || []).map(c => el('div', { class: 'lineitem' }, c));

  const cropCell = a.crop_url
    ? el('img', { src: a.crop_url, alt: 'answer crop' })
    : el('div', { class: 'mute', style: 'text-align:center; font-size:13px; padding:20px' }, '📄', el('div', { style:'margin-top:6px' }, 'Whole-booklet compare'), el('div', {}, 'vs. answer key'));

  return el('div', { class: 'rev' },
    el('div', { class: 'crop' }, cropCell),
    el('div', { class: 'body' },
      el('div', { style: 'display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap' },
        el('span', { class: 'tnum mute', style: 'font-size:13px' }, a.student_alias || ''),
        el('span', { class: 'pill-tag' }, `Q${a.question_no} · ${a.concept || ''}`),
        a.needs_human ? el('span', { class: 'chip chip-review' }, 'needs review') : null,
        el('span', { style: 'margin-left:auto; font-size:14px; color:var(--ink-2)' }, `${pct}% conf`),
      ),
      bar,
      el('h3', { class: 'heading-sm', style: 'margin:16px 0 4px' }, 'Extracted answer — two-pass diff'),
      diffHtml(a.diff),
      el('div', { class: 'mute', style: 'font-size:14px; margin:10px 0' }, el('b', { style:'color:var(--ink-2)' }, 'Rationale: '), a.rationale || '—'),
      el('h3', { class: 'heading-sm', style: 'margin:12px 0 8px' }, 'Rubric criteria'),
      ...rubricLines,
      el('div', { style: 'display:flex; align-items:center; gap:10px; margin-top:14px; flex-wrap:wrap' },
        el('span', { class: 'mute', style:'font-size:14px' }, 'Marks'),
        marksInput,
        el('span', { class: 'mute', style:'font-size:14px' }, `/ ${fmt(a.max_marks)}`),
        saveBtn, micBtn,
      ),
    ),
  );
}

function wireMic(btn, a, marksInput) {
  let rec, chunks = [];
  btn.onclick = async () => {
    if (rec && rec.state === 'recording') { rec.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      rec = new MediaRecorder(stream); chunks = [];
      rec.ondataavailable = e => chunks.push(e.data);
      rec.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        btn.textContent = '⏳ transcribing…';
        const fd = new FormData();
        fd.append('audio', new Blob(chunks, { type: 'audio/webm' }), 'override.webm');
        fd.append('new_marks', marksInput.value);
        try {
          const r = await api(`/api/answers/${a.id}/voice-override`, { method: 'POST', body: fd });
          toast('Transcribed → audit: “' + (r.transcript || '(empty)') + '”');
        } catch (e) { toast('Voice override failed: ' + e.message); }
        btn.textContent = '🎙 Speak reason';
      };
      rec.start(); btn.textContent = '⏹ stop';
    } catch (e) { toast('Mic unavailable: ' + e.message); }
  };
}

function render() {
  const only = document.getElementById('onlyReview').checked;
  const box = document.getElementById('answers');
  box.innerHTML = '';
  const rows = ALL.filter(a => !only || a.needs_human);
  if (!rows.length) { box.append(el('div', { class: 'card mute' }, 'Nothing to review yet — grade some scripts first.')); return; }
  rows.forEach(a => box.append(renderItem(a)));
}
document.getElementById('onlyReview').onchange = render;

api(`/api/w/${WID}/review`).then(d => { ALL = d.answers; render(); })
  .catch(e => toast('Load failed: ' + e.message));
</script>
